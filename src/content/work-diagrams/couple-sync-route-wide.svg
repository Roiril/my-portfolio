<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 142" role="img"><title>couple-sync の同期の路線図</title><desc>自分の端末の画面と IndexedDB から送信待ちの列を通って Supabase へ行き、通知と差分の取得で相手の端末へ届く。通信が切れている間は送信待ちの列で待つ。</desc><rect x="0" y="0" width="268" height="142" fill="#f5f2eb"/><path d="M86.000 92.000 L103.757 109.757 Q108.000 114.000 114.000 114.000 L140.000 114.000" fill="none" stroke="#14110e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2.6 3.4"/><path d="M134.000 38.000 L174.000 38.000 Q180.000 38.000 180.000 44.000 L180.000 84.000" fill="none" stroke="#1f5fbf" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M16.000 112.000 L54.000 112.000 Q60.000 112.000 64.243 107.757 L81.757 90.243 Q86.000 86.000 90.243 81.757 L129.757 42.243 Q134.000 38.000 138.243 42.243 L175.757 79.757 Q180.000 84.000 184.243 88.243 L203.757 107.757 Q208.000 112.000 214.000 112.000 L250.000 112.000" fill="none" stroke="#d8321f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="16.00" cy="112.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="13.700" y="102.942" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="start" fill="#14110e">画面</text><text x="13.700" y="107.100" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="start" fill="#8b867c">部屋のものを開く</text><circle cx="60.00" cy="112.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="60.000" y="119.245" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="middle" fill="#14110e">IndexedDB</text><text x="60.000" y="123.403" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="middle" fill="#8b867c">まず端末に書く</text><circle cx="86.00" cy="86.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="81.900" y="85.253" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="end" fill="#14110e">送信待ちの列</text><text x="81.900" y="89.411" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="end" fill="#8b867c">消えずに残る</text><circle cx="140.00" cy="114.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="140.000" y="121.245" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="middle" fill="#14110e">ここで待つ</text><text x="140.000" y="125.403" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="middle" fill="#8b867c">通信が切れている間</text><circle cx="134.00" cy="38.00" r="3.33" fill="#f5f2eb" stroke="#14110e" stroke-width="1.1"/><text x="128.865" y="35.174" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="end" fill="#14110e">Supabase</text><text x="128.865" y="39.332" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="end" fill="#8b867c">関数を通して</text><text x="128.865" y="43.490" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="end" fill="#8b867c">書き込む</text><circle cx="180.00" cy="38.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="184.100" y="37.253" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="start" fill="#14110e">Realtime</text><text x="184.100" y="41.411" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="start" fill="#8b867c">変更を知らせる</text><circle cx="180.00" cy="84.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="184.100" y="83.253" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="start" fill="#14110e">差分の取得</text><text x="184.100" y="87.411" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="start" fill="#8b867c">サーバーの通し番号で</text><circle cx="208.00" cy="112.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="208.000" y="119.245" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="middle" fill="#14110e">IndexedDB</text><circle cx="250.00" cy="112.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="252.300" y="107.100" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="end" fill="#14110e">相手の画面</text></svg>