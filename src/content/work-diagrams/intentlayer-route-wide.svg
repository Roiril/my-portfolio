<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 128" role="img"><title>IntentLayer の路線図</title><desc>意図を書き、空間に置き、必要なときに見るまでは共通で、その先が HMD 版と Web 版に分かれる。</desc><rect x="0" y="0" width="268" height="128" fill="#f5f2eb"/><path d="M108.000 114.000 L144.000 114.000 Q150.000 114.000 154.580 110.124 L176.000 92.000" fill="none" stroke="#e9a800" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M16.000 62.000 L122.000 62.000 Q128.000 62.000 132.377 66.104 L155.623 87.896 Q160.000 92.000 166.000 92.000 L250.000 92.000" fill="none" stroke="#14110e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M16.000 58.000 L122.000 58.000 Q128.000 58.000 132.243 53.757 L155.757 30.243 Q160.000 26.000 166.000 26.000 L250.000 26.000" fill="none" stroke="#d8321f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="16.00" cy="60.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="13.700" y="50.942" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="start" fill="#14110e">意図を書く</text><text x="13.700" y="55.100" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="start" fill="#8b867c">本人が書く</text><circle cx="66.00" cy="60.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="66.000" y="50.942" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="middle" fill="#14110e">空間に置く</text><text x="66.000" y="55.100" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="middle" fill="#8b867c">書いた人のそばに</text><circle cx="116.00" cy="60.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="116.000" y="50.942" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="middle" fill="#14110e">スキャンする</text><text x="116.000" y="55.100" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="middle" fill="#8b867c">見たいときだけ</text><circle cx="198.00" cy="26.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="198.000" y="16.942" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="middle" fill="#14110e">HMD 版</text><text x="198.000" y="21.100" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="middle" fill="#8b867c">Quest 3 のパススルー</text><circle cx="250.00" cy="26.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="252.300" y="33.245" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="end" fill="#14110e">頭の上に表示</text><text x="252.300" y="37.403" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="end" fill="#8b867c">空間アンカーで固定</text><circle cx="198.00" cy="92.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="198.000" y="99.245" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="middle" fill="#14110e">Web 版</text><text x="198.000" y="103.403" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="middle" fill="#8b867c">React Three Fiber</text><circle cx="250.00" cy="92.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="252.300" y="82.942" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="end" fill="#