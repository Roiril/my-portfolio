<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 288" role="img"><title>Meiji Univ 3F の路線図</title><desc>歩幅で測り、形を作り、写真を貼ったモデルを、VR での議論とシェーダーの実験に使う。</desc><rect x="0" y="0" width="152" height="288" fill="#f5f2eb"/><path d="M53.000 34.000 L53.000 152.000 Q53.000 158.000 57.243 162.243 L80.757 185.757 Q85.000 190.000 85.000 196.000 L85.000 268.000" fill="none" stroke="#14110e" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M49.000 34.000 L49.000 152.000 Q49.000 158.000 44.896 162.377 L23.104 185.623 Q19.000 190.000 19.000 196.000 L19.000 268.000" fill="none" stroke="#d8321f" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="51.00" cy="34.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="56.400" y="32.766" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="start" fill="#14110e">測る</text><text x="56.400" y="39.447" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.0616" font-weight="400" text-anchor="start" fill="#8b867c">歩幅を基準にする</text><circle cx="51.00" cy="94.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="56.400" y="89.425" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="start" fill="#14110e">形を作る</text><text x="56.400" y="96.107" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.0616" font-weight="400" text-anchor="start" fill="#8b867c">柱や什器は</text><text x="56.400" y="102.788" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.0616" font-weight="400" text-anchor="start" fill="#8b867c">モデリング</text><circle cx="51.00" cy="152.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="56.400" y="150.766" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="start" fill="#14110e">写真を貼る</text><text x="56.400" y="157.447" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.0616" font-weight="400" text-anchor="start" fill="#8b867c">現地で撮る</text><circle cx="19.00" cy="268.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="24.400" y="266.766" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="start" fill="#14110e">VR で議論する</text><text x="24.400" y="273.447" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.0616" font-weight="400" text-anchor="start" fill="#8b867c">未来の姿を検討する</text><circle cx="85.00" cy="268.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="90.400" y="266.766" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="start" fill="#14110e">見え方を変える</text><text x="90.400" y="273.447" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.0616" font-weight="400" text-anchor="start" fill="#8b867c">シェーダーグラフ</text></svg>