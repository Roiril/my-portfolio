<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 290" role="img"><title>Meiji Univ 3F の路線図</title><desc>歩幅で測り、形を作り、写真を貼ったモデルを、VR での議論とシェーダーの実験に使う。</desc><rect x="0" y="0" width="190" height="290" fill="#f5f2eb"/><path d="M70.000 34.000 L70.000 152.000 Q70.000 158.000 74.243 162.243 L97.757 185.757 Q102.000 190.000 102.000 196.000 L102.000 268.000" fill="none" stroke="#14110e" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M66.000 34.000 L66.000 152.000 Q66.000 158.000 61.896 162.377 L40.104 185.623 Q36.000 190.000 36.000 196.000 L36.000 268.000" fill="none" stroke="#d8321f" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="68.00" cy="34.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="73.400" y="32.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">測る</text><text x="73.400" y="39.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">歩幅を基準にする</text><circle cx="68.00" cy="94.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="73.400" y="92.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">形を作る</text><text x="73.400" y="99.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">柱や什器はモデリング</text><circle cx="68.00" cy="152.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="73.400" y="150.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">写真を貼る</text><text x="73.400" y="157.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">現地で撮る</text><circle cx="36.00" cy="268.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="41.400" y="266.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">VR で議論する</text><text x="41.400" y="273.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">未来の姿を検討する</text><circle cx="102.00" cy="268.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="107.400" y="266.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">見え方を変える</text><text x="107.400" y="273.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">シェーダーグラフ</text></svg>