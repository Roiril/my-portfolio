<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 112" role="img"><title>Meiji Univ 3F の路線図</title><desc>歩幅で測り、形を作り、写真を貼ったモデルを、VR での議論とシェーダーの実験に使う。</desc><rect x="0" y="0" width="268" height="112" fill="#f5f2eb"/><path d="M16.000 58.000 L134.000 58.000 Q140.000 58.000 144.243 62.243 L167.757 85.757 Q172.000 90.000 178.000 90.000 L250.000 90.000" fill="none" stroke="#14110e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M16.000 54.000 L134.000 54.000 Q140.000 54.000 144.377 49.896 L167.623 28.104 Q172.000 24.000 178.000 24.000 L250.000 24.000" fill="none" stroke="#d8321f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="16.00" cy="56.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="13.700" y="46.942" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="start" fill="#14110e">測る</text><text x="13.700" y="51.100" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="start" fill="#8b867c">歩幅を基準にする</text><circle cx="76.00" cy="56.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="76.000" y="63.245" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="middle" fill="#14110e">形を作る</text><text x="76.000" y="67.403" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="middle" fill="#8b867c">柱や什器はモデリング</text><circle cx="134.00" cy="56.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="134.000" y="46.942" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="middle" fill="#14110e">写真を貼る</text><text x="134.000" y="51.100" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="middle" fill="#8b867c">現地で撮る</text><circle cx="250.00" cy="24.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="252.300" y="31.245" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="end" fill="#14110e">VR で議論する</text><text x="252.300" y="35.403" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="end" fill="#8b867c">未来の姿を検討する</text><circle cx="250.00" cy="90.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="252.300" y="80.942" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="end" fill="#14110e">見え方を変える</text><text x="252.300" y="85.100" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="end" fill="#8b867c">シェーダーグラフ</text></svg>