<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 286" role="img"><title>AI 業務ツールの路線図</title><desc>商談の内容から見積書の下書きを作る線と、質問からマニュアルを検索して答える線が、人が確かめる駅で合流する。</desc><rect x="0" y="0" width="152" height="286" fill="#f5f2eb"/><path d="M86.000 34.000 L86.000 84.000 Q86.000 90.000 82.114 94.572 L55.886 125.428 Q52.000 130.000 55.886 134.572 L82.114 165.428 Q86.000 170.000 82.331 174.748 L52.000 214.000" fill="none" stroke="#14110e" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M18.000 34.000 L18.000 84.000 Q18.000 90.000 21.886 94.572 L48.114 125.428 Q52.000 130.000 48.114 134.572 L21.886 165.428 Q18.000 170.000 21.669 174.748 L48.331 209.252 Q52.000 214.000 52.000 220.000 L52.000 268.000" fill="none" stroke="#d8321f" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="18.00" cy="34.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="23.400" y="36.107" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="start" fill="#14110e">商談の内容</text><circle cx="86.00" cy="34.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="91.400" y="36.107" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="start" fill="#14110e">質問</text><circle cx="86.00" cy="90.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="91.400" y="92.107" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="start" fill="#14110e">マニュアルを検索</text><circle cx="52.00" cy="130.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="46.600" y="132.107" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="end" fill="#14110e">LLM</text><circle cx="18.00" cy="170.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="23.400" y="172.107" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="start" fill="#14110e">見積書の下書き</text><circle cx="86.00" cy="170.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="91.400" y="165.425" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="start" fill="#14110e">根拠つきの答え</text><text x="91.400" y="172.107" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.0616" font-weight="400" text-anchor="start" fill="#8b867c">どの箇所を</text><text x="91.400" y="178.788" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.0616" font-weight="400" text-anchor="start" fill="#8b867c">見たかを示す</text><circle cx="52.00" cy="214.00" r="4.35" fill="#f5f2eb" stroke="#14110e" stroke-width="1.1"/><text x="45.250" y="216.107" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="end" fill="#14110e">人が確かめる</text><circle cx="52.00" cy="268.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="57.400" y="270.107" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.852" font-weight="700" text-anchor="start" fill="#14110e">使う</text></svg>