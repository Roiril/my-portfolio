<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 290" role="img"><title>AI 業務ツールの路線図</title><desc>商談の内容から見積書の下書きを作る線と、質問からマニュアルを検索して答える線が、人が確かめる駅で合流する。</desc><rect x="0" y="0" width="190" height="290" fill="#f5f2eb"/><path d="M108.000 34.000 L108.000 84.000 Q108.000 90.000 104.114 94.572 L77.886 125.428 Q74.000 130.000 77.886 134.572 L104.114 165.428 Q108.000 170.000 104.331 174.748 L74.000 214.000" fill="none" stroke="#14110e" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M40.000 34.000 L40.000 84.000 Q40.000 90.000 43.886 94.572 L70.114 125.428 Q74.000 130.000 70.114 134.572 L43.886 165.428 Q40.000 170.000 43.669 174.748 L70.331 209.252 Q74.000 214.000 74.000 220.000 L74.000 268.000" fill="none" stroke="#d8321f" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="40.00" cy="34.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="45.400" y="36.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">商談の内容</text><circle cx="108.00" cy="34.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="113.400" y="36.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">質問</text><circle cx="108.00" cy="90.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="113.400" y="92.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">マニュアルを検索</text><circle cx="74.00" cy="130.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="68.600" y="132.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="end" fill="#14110e">LLM</text><circle cx="40.00" cy="170.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="45.400" y="172.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">見積書の下書き</text><circle cx="108.00" cy="170.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="113.400" y="168.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">根拠つきの答え</text><text x="113.400" y="175.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">どの箇所を見たかを示す</text><circle cx="74.00" cy="214.00" r="4.35" fill="#f5f2eb" stroke="#14110e" stroke-width="1.1"/><text x="67.250" y="216.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="end" fill="#14110e">人が確かめる</text><circle cx="74.00" cy="268.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="79.400" y="270.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">使う</text></svg>