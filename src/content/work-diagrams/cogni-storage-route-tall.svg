<circle cx="92.00" cy="270.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="97.400" y="272.328" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.468" font-weight="700" text-anchor="start" fill="#14110e">ほかの端末</text></svg>