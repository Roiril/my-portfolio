<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 292" role="img"><title>cogni-storage の路線図</title><desc>アプリの画面から IndexedDB と送信待ちの列を通って Supabase へ行き、ほかの端末へ差分が届く。依頼は Supabase を通して Claude Code に届き、返答が画面へ戻る。研究メモは git に残り、ビルドのときにアプリへ入る。</desc><rect x="0" y="0" width="168" height="292" fill="#f5f2eb"/><path d="M30.000 40.000 L116.000 40.000" fill="none" stroke="#14110e" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M38.000 156.000 L38.000 216.000 Q38.000 222.000 38.000 228.000 L38.000 270.000" fill="none" stroke="#e9a800" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M44.000 156.000 L87.757 199.757 Q92.000 204.000 92.000 210.000 L92.000 270.000" fill="none" stroke="#1f5fbf" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M122.000 40.000 L122.000 78.000 Q122.000 84.000 117.757 88.243 L96.243 109.757 Q92.000 114.000 87.757 118.243 L44.000 162.000" fill="none" stroke="#d8321f" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="30.00" cy="40.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="30.000" y="50.898" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.468" font-weight="700" text-anchor="middle" fill="#14110e">研究メモ</text><text x="30.000" y="58.282" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.5944" font-weight="400" text-anchor="middle" fill="#8b867c">Markdown で書く</text><circle cx="72.00" cy="40.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="72.000" y="19.031" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.468" font-weight="700" text-anchor="middle" fill="#14110e">git</text><text x="72.000" y="26.415" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.5944" font-weight="400" text-anchor="middle" fill="#8b867c">追記の</text><text x="72.000" y="33.800" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.5944" font-weight="400" text-anchor="middle" fill="#8b867c">履歴を残す</text><circle cx="122.00" cy="40.00" r="4.35" fill="#f5f2eb" stroke="#14110e" stroke-width="1.1"/><text x="128.750" y="42.328" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.468" font-weight="700" text-anchor="start" fill="#14110e">アプリの画面</text><circle cx="122.00" cy="84.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="127.400" y="78.944" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.468" font-weight="700" text-anchor="start" fill="#14110e">IndexedDB</text><text x="127.400" y="86.328" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.5944" font-weight="400" text-anchor="start" fill="#8b867c">画面は</text><text x="127.400" y="93.713" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.5944" font-weight="400" text-anchor="start" fill="#8b867c">ここから表示</text><circle cx="92.00" cy="114.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="89.900" y="93.831" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.468" font-weight="700" text-anchor="end" fill="#14110e">送信待ちの列</text><text x="89.900" y="101.215" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.5944" font-weight="400" text-anchor="end" fill="#8b867c">古い変更は</text><text x="89.900" y="108.600" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.5944" font-weight="400" text-anchor="end" fill="#8b867c">まとめる</text><circle cx="41.00" cy="159.00" r="4.35" fill="#f5f2eb" stroke="#14110e" stroke-width="1.1"/><text x="34.250" y="157.636" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-ser