<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 300" role="img"><title>cogni-storage の路線図</title><desc>アプリの画面から IndexedDB と送信待ちの列を通って Supabase へ行き、ほかの端末へ差分が届く。依頼は Supabase を通して Claude Code に届き、返答が画面へ戻る。研究メモは git に残り、ビルドのときにアプリへ入る。</desc><rect x="0" y="0" width="214" height="300" fill="#f5f2eb"/><path d="M26.000 34.000 L112.000 34.000" fill="none" stroke="#14110e" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M34.000 150.000 L34.000 210.000 Q34.000 216.000 34.000 222.000 L34.000 264.000" fill="none" stroke="#e9a800" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M40.000 150.000 L83.757 193.757 Q88.000 198.000 88.000 204.000 L88.000 264.000" fill="none" stroke="#1f5fbf" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M118.000 34.000 L118.000 72.000 Q118.000 78.000 113.757 82.243 L92.243 103.757 Q88.000 108.000 83.757 112.243 L40.000 156.000" fill="none" stroke="#d8321f" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="26.00" cy="34.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="26.000" y="44.500" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="middle" fill="#14110e">研究メモ</text><text x="26.000" y="51.232" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="middle" fill="#8b867c">Markdown で書く</text><circle cx="68.00" cy="34.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="68.000" y="21.068" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="middle" fill="#14110e">git</text><text x="68.000" y="27.800" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="middle" fill="#8b867c">追記の履歴を残す</text><circle cx="118.00" cy="34.00" r="4.35" fill="#f5f2eb" stroke="#14110e" stroke-width="1.1"/><text x="124.750" y="36.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">アプリの画面</text><circle cx="118.00" cy="78.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="123.400" y="76.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">IndexedDB</text><text x="123.400" y="83.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">画面はここから表示</text><circle cx="88.00" cy="108.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="93.400" y="106.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">送信待ちの列</text><text x="93.400" y="113.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">古い変更はまとめる</text><circle cx="37.00" cy="153.00" r="4.35" fill="#f5f2eb" stroke="#14110e" stroke-width="1.1"/><text x="30.250" y="151.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="end" fill="#14110e">Supabase</text><text x="30.250" y="158.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="end" fill="#8b867c">4 つの表</text><circle cx="34.00" cy="264.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="39.400" y="259.428" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">Claude Code</text><text x="39.400" y="266.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">依頼を受けて処理する</text><text x="39.400" y="272.892" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">返答は画面へ届く</text><circle cx="88.00" cy="198.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="93.400" y="196.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">通し番号</text><text x="93.400" y="203.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">前回の続きから取る</text><circle cx="88.00" cy="264.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="93.400" y="266.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">ほかの端末</text></svg>