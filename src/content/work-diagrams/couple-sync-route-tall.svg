<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 300" role="img"><title>couple-sync の同期の路線図</title><desc>自分の端末の画面と IndexedDB から送信待ちの列を通って Supabase へ行き、通知と差分の取得で相手の端末へ届く。通信が切れている間は送信待ちの列で待つ。</desc><rect x="0" y="0" width="214" height="300" fill="#f5f2eb"/><path d="M98.000 104.000 L115.757 121.757 Q120.000 126.000 120.000 132.000 L120.000 158.000" fill="none" stroke="#14110e" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2.6 3.4"/><path d="M44.000 152.000 L44.000 192.000 Q44.000 198.000 50.000 198.000 L90.000 198.000" fill="none" stroke="#1f5fbf" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M118.000 34.000 L118.000 72.000 Q118.000 78.000 113.757 82.243 L96.243 99.757 Q92.000 104.000 87.757 108.243 L48.243 147.757 Q44.000 152.000 48.243 156.243 L85.757 193.757 Q90.000 198.000 94.243 202.243 L113.757 221.757 Q118.000 226.000 118.000 232.000 L118.000 268.000" fill="none" stroke="#d8321f" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="118.00" cy="34.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="123.400" y="32.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">画面</text><text x="123.400" y="39.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">部屋のものを開く</text><circle cx="118.00" cy="78.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="123.400" y="76.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">IndexedDB</text><text x="123.400" y="83.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">まず端末に書く</text><circle cx="92.00" cy="104.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="89.900" y="91.868" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="end" fill="#14110e">送信待ちの列</text><text x="89.900" y="98.600" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="end" fill="#8b867c">消えずに残る</text><circle cx="120.00" cy="158.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="125.400" y="156.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">ここで待つ</text><text x="125.400" y="163.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">通信が切れている間</text><circle cx="44.00" cy="152.00" r="4.35" fill="#f5f2eb" stroke="#14110e" stroke-width="1.1"/><text x="37.250" y="147.428" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="end" fill="#14110e">Supabase</text><text x="37.250" y="154.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="end" fill="#8b867c">関数を通して</text><text x="37.250" y="160.892" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="end" fill="#8b867c">書き込む</text><circle cx="44.00" cy="198.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="38.600" y="196.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="end" fill="#14110e">Realtime</text><text x="38.600" y="203.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="end" fill="#8b867c">変更を知らせる</text><circle cx="90.00" cy="198.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="95.400" y="196.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">差分の取得</text><text x="95.400" y="203.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">サーバーの通し番号で</text><circle cx="118.00" cy="226.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="123.400" y="228.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">IndexedDB</text><circle cx="118.00" cy="268.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="123.400" y="270.160" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">相手の画面</text></svg>