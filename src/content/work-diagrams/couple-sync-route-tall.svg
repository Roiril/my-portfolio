<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 286" role="img"><title>couple-sync の同期の路線図</title><desc>自分の端末の画面と IndexedDB から送信待ちの列を通って Supabase へ行き、通知と差分の取得で相手の端末へ届く。通信が切れている間は送信待ちの列で待つ。</desc><rect x="0" y="0" width="172" height="286" fill="#f5f2eb"/><path d="M97.000 104.000 L114.757 121.757 Q119.000 126.000 119.000 132.000 L119.000 158.000" fill="none" stroke="#14110e" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2.6 3.4"/><path d="M43.000 152.000 L43.000 192.000 Q43.000 198.000 49.000 198.000 L89.000 198.000" fill="none" stroke="#1f5fbf" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M117.000 34.000 L117.000 72.000 Q117.000 78.000 112.757 82.243 L95.243 99.757 Q91.000 104.000 86.757 108.243 L47.243 147.757 Q43.000 152.000 47.243 156.243 L84.757 193.757 Q89.000 198.000 93.243 202.243 L112.757 221.757 Q117.000 226.000 117.000 232.000 L117.000 268.000" fill="none" stroke="#d8321f" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="117.00" cy="34.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="122.400" y="32.604" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.622" font-weight="700" text-anchor="start" fill="#14110e">画面</text><text x="122.400" y="40.164" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.727600000000001" font-weight="400" text-anchor="start" fill="#8b867c">部屋のものを開く</text><circle cx="117.00" cy="78.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="122.400" y="76.604" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.622" font-weight="700" text-anchor="start" fill="#14110e">IndexedDB</text><text x="122.400" y="84.164" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.727600000000001" font-weight="400" text-anchor="start" fill="#8b867c">まず端末に書く</text><circle cx="91.00" cy="104.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="88.900" y="91.040" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.622" font-weight="700" text-anchor="end" fill="#14110e">送信待ちの列</text><text x="88.900" y="98.600" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.727600000000001" font-weight="400" text-anchor="end" fill="#8b867c">消えずに残る</text><circle cx="119.00" cy="158.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="124.400" y="152.823" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.622" font-weight="700" text-anchor="start" fill="#14110e">ここで待つ</text><text x="124.400" y="160.384" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.727600000000001" font-weight="400" text-anchor="start" fill="#8b867c">通信が</text><text x="124.400" y="167.944" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.727600000000001" font-weight="400" text-anchor="start" fill="#8b867c">切れている間</text><circle cx="43.00" cy="152.00" r="4.35" fill="#f5f2eb" stroke="#14110e" stroke-width="1.1"/><text x="36.250" y="146.823" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.622" font-weight="700" text-anchor="end" fill="#14110e">Supabase</text><text x="36.250" y="154.384" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.727600000000001" font-weight="400" text-anchor="end" fill="#8b867c">関数を通して</text><text x="36.250" y="161.944" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.727600000000001" font-weight="400" text-anchor="end" fill="#8b867c">書き込む</text><circle cx="43.00" cy="198.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="37.600" y="192.823" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.622" font-weight="700" text-anchor="end" fill="#14110e">Realtime</text><text x="37.600" y="200.384" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.727600000000001" font-weight="400" text-anchor="end" fill="#8b867c">変更を</text><text x="37.600" y="207.944" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.727600000000001" font-weight="400" text-anchor="end" fill="#8b867c">知らせる</text><circle cx="89.00" cy="198.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="91.100" y="177.479" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.622" font-weight="700" text-anchor="start" fill="#14110e">差分の取得</text><text x="91.100" y="185.040" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.727600000000001" font-weight="400" text-anchor="start" fill="#8b867c">サーバーの</text><text x="91.100" y="192.600" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.727600000000001" font-weight="400" text-anchor="start" fill="#8b867c">通し番号で</text><circle cx="117.00" cy="226.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="122.400" y="228.384" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.622" font-weight="700" text-anchor="start" fill="#14110e">IndexedDB</text><circle cx="117.00" cy="268.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="122.400" y="270.384" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.622" font-weight="700" text-anchor="start" fill="#14110e">相手の画面</text></svg>