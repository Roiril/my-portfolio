<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 284" role="img"><title>IntentLayer の路線図</title><desc>意図を書き、空間に置き、必要なときに見るまでは共通で、その先が HMD 版と Web 版に分かれる。</desc><rect x="0" y="0" width="160" height="284" fill="#f5f2eb"/><path d="M96.000 124.000 L96.000 160.000 Q96.000 166.000 92.124 170.580 L74.000 192.000" fill="none" stroke="#e9a800" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M44.000 32.000 L44.000 138.000 Q44.000 144.000 48.104 148.377 L69.896 171.623 Q74.000 176.000 74.000 182.000 L74.000 266.000" fill="none" stroke="#14110e" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M40.000 32.000 L40.000 138.000 Q40.000 144.000 35.757 148.243 L12.243 171.757 Q8.000 176.000 8.000 182.000 L8.000 266.000" fill="none" stroke="#d8321f" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="42.00" cy="32.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="47.400" y="30.701" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.16" font-weight="700" text-anchor="start" fill="#14110e">意図を書く</text><text x="47.400" y="37.734" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.328" font-weight="400" text-anchor="start" fill="#8b867c">本人が書く</text><circle cx="42.00" cy="82.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="47.400" y="80.701" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.16" font-weight="700" text-anchor="start" fill="#14110e">空間に置く</text><text x="47.400" y="87.734" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.328" font-weight="400" text-anchor="start" fill="#8b867c">書いた人のそばに</text><circle cx="42.00" cy="132.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="47.400" y="130.701" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x