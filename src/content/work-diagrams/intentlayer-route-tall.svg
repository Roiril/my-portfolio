<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 300" role="img"><title>IntentLayer の路線図</title><desc>意図を書き、空間に置き、必要なときに見るまでは共通で、その先が HMD 版と Web 版に分かれる。</desc><rect x="0" y="0" width="214" height="300" fill="#f5f2eb"/><path d="M120.000 124.000 L120.000 160.000 Q120.000 166.000 116.124 170.580 L98.000 192.000" fill="none" stroke="#e9a800" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M68.000 32.000 L68.000 138.000 Q68.000 144.000 72.104 148.377 L93.896 171.623 Q98.000 176.000 98.000 182.000 L98.000 266.000" fill="none" stroke="#14110e" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M64.000 32.000 L64.000 138.000 Q64.000 144.000 59.757 148.243 L36.243 171.757 Q32.000 176.000 32.000 182.000 L32.000 266.000" fill="none" stroke="#d8321f" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="66.00" cy="32.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="71.400" y="30.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">意図を書く</text><text x="71.400" y="37.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">本人が書く</text><circle cx="66.00" cy="82.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="71.400" y="80.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="6.0" font-weight="700" text-anchor="start" fill="#14110e">空間に置く</text><text x="71.400" y="87.526" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="5.1" font-weight="400" text-anchor="start" fill="#8b867c">書いた人のそばに</text><circle cx="66.00" cy="132.00" r="3.00" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="71.400" y="130.794" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#