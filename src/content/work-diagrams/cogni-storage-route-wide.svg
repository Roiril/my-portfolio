<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 146" role="img"><title>cogni-storage の路線図</title><desc>アプリの画面から IndexedDB と送信待ちの列を通って Supabase へ行き、ほかの端末へ差分が届く。依頼は Supabase を通して Claude Code に届き、返答が画面へ戻る。研究メモは git に残り、ビルドのときにアプリへ入る。</desc><rect x="0" y="0" width="268" height="146" fill="#f5f2eb"/><path d="M18.000 26.000 L18.000 112.000" fill="none" stroke="#14110e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M134.000 34.000 L194.000 34.000 Q200.000 34.000 206.000 34.000 L248.000 34.000" fill="none" stroke="#e9a800" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M134.000 40.000 L177.757 83.757 Q182.000 88.000 188.000 88.000 L248.000 88.000" fill="none" stroke="#1f5fbf" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M18.000 118.000 L56.000 118.000 Q62.000 118.000 66.243 113.757 L87.757 92.243 Q92.000 88.000 96.243 83.757 L140.000 40.000" fill="none" stroke="#d8321f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="18.00" cy="26.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="22.100" y="25.253" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="start" fill="#14110e">研究メモ</text><text x="22.100" y="29.411" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="start" fill="#8b867c">Markdown で書く</text><circle cx="18.00" cy="68.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="22.100" y="67.253" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="start" fill="#14110e">git</text><text x="22.100" y="71.411" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="start" fill="#8b867c">追記の履歴を残す</text><circle cx="18.00" cy="118.00" r="3.33" fill="#f5f2eb" stroke="#14110e" stroke-width="1.1"/><text x="14.665" y="126.280" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="start" fill="#14110e">アプリの画面</text><circle cx="62.00" cy="118.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="62.000" y="125.245" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="middle" fill="#14110e">IndexedDB</text><text x="62.000" y="129.403" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="middle" fill="#8b867c">画面はここから表示</text><circle cx="92.00" cy="88.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="96.100" y="87.253" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="start" fill="#14110e">送信待ちの列</text><text x="96.100" y="91.411" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="start" fill="#8b867c">古い変更はまとめる</text><circle cx="137.00" cy="37.00" r="3.33" fill="#f5f2eb" stroke="#14110e" stroke-width="1.1"/><text x="137.000" y="26.907" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="middle" fill="#14110e">Supabase</text><text x="137.000" y="31.065" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="middle" fill="#8b867c">4 つの表</text><circle cx="248.00" cy="34.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="250.300" y="41.245" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="end" fill="#14110e">Claude Code</text><text x="250.300" y="45.403" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="end" fill="#8b867c">依頼を受けて処理する</text><text x="250.300" y="49.561" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="end" fill="#8b867c">返答は画面へ届く</text><circle cx="182.00" cy="88.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="182.000" y="95.245" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="middle" fill="#14110e">通し番号</text><text x="182.000" y="99.403" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.15" font-weight="400" text-anchor="middle" fill="#8b867c">前回の続きから取る</text><circle cx="248.00" cy="88.00" r="2.30" fill="#f5f2eb" stroke="#14110e" stroke-width="0.85"/><text x="250.300" y="95.245" font-family="&#x27;Zen Kaku Gothic New&#x27;,&#x27;Yu Gothic&#x27;,sans-serif" font-size="3.7" font-weight="700" text-anchor="end" fill="#14110e">ほかの端末</text></svg>