    #splash {

      flex-direction: column;

      background: #000000;
      color: #fffaf0;

      padding: 24px;

    #splash .splash-title {

    #splash .splash-subtitle {

      color: rgba(255, 250, 240, 0.5);

    }
    #splash .splash-status {
      display: flex;

      align-items: center;
      gap: 12px;

      max-width: 70vw;
    }
    #splash .splash-step {

      color: rgba(255, 250, 240, 0.5);
      margin: 0;
      text-align: center;
      line-height: 1.6;
    }
    #splash .splash-track {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }
    #splash .splash-bar {
      width: 40%;
      height: 100%;
      background: #ffdead;
      border-radius: 4px;
      transition: width 0.4s ease-out;
      animation: splashPulse 1.4s ease-in-out infinite;
    }
    @keyframes splashPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

  <script>
    // スプラッシュ表示開始時刻（hideSplash が最低表示時間の計算に使う）
    window.__ynSplashShownAt = Date.now();
    // JS 本体が起動しないまま 20 秒経ったら失敗文言に差し替える（起動時にクリアされる）
    window.__ynSplashTimeout = window.setTimeout(function () {
      var el = document.querySelector('#splash [data-splash-step]');
      if (el) el.textContent = '読み込みに失敗したみたい。通信環境を確認して再読み込みしてね';
